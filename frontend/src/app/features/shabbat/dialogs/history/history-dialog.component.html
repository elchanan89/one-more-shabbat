<div class="dialog-header" mat-dialog-title>
  <div class="title-block">
    <h2 class="history-title">היסטוריית שבתות</h2>
    <p class="history-subtitle">שבתות שעברו</p>
  </div>
  <button mat-icon-button class="close-btn" (click)="close()" aria-label="סגור">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="dialog-content">

  @if (loading()) {
    <div class="loading-center">
      <mat-progress-spinner mode="indeterminate" diameter="36" />
    </div>
  } @else if (records().length === 0) {
    <p class="empty-msg">אין שבתות בהיסטוריה</p>
  } @else {
    <div class="history-list">
      @for (record of records(); track record.id) {
        <div class="history-row">
          <div class="history-date">{{ formatDate(record.gregorianDate) }}</div>
          <div class="history-desc">{{ record.description }}</div>
        </div>
      }
    </div>
  }

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-flat-button class="btn-slate" (click)="close()">סגור</button>
</mat-dialog-actions>
